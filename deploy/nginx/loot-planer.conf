# /etc/nginx/conf.d/loot-planer.conf
# Copy of the server's file. The 443 block and the HTTP redirect were added by
# `certbot --nginx -d loot-planer.nic-weiss.tech`, the same way as notifier.conf; certbot renews the certificate.
server {
    server_name loot-planer.nic-weiss.tech;

    client_max_body_size 8m;  # stash export upload is about 1 MB; nginx's default is 1 MB

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;  # signing in fetches the stash from blizzless.trade for every realm
        proxy_pass http://127.0.0.1:8190;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/loot-planer.nic-weiss.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/loot-planer.nic-weiss.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = loot-planer.nic-weiss.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name loot-planer.nic-weiss.tech;
    listen 80;
    return 404; # managed by Certbot


}